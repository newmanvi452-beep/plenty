<!-- Paste into Supabase > Authentication > Emails > "Magic link" AND "Confirm sign up".
     Subject: {{ .Token }} is your Serves Twenty sign-in code -->
<div style="background:#faf6ef;padding:32px 16px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;color:#2b2118">
  <div style="max-width:420px;margin:0 auto;background:#ffffff;border-radius:18px;padding:32px 28px;text-align:center">
    <div style="font-size:26px;font-weight:700;letter-spacing:-0.5px;color:#b5541c">Serves Twenty</div>
    <p style="font-size:16px;line-height:1.5;margin:20px 0 8px">Here's your sign-in code. Type it into the app to finish signing in.</p>
    <div style="font-size:38px;font-weight:700;letter-spacing:10px;margin:22px 0;padding:16px 0;background:#faf6ef;border-radius:12px">{{ .Token }}</div>
    <p style="font-size:14px;line-height:1.5;color:#7a6a5a;margin:0">It works once and expires in an hour. If you didn't ask for it, you can ignore this email.</p>
  </div>
  <p style="text-align:center;font-size:12px;color:#9a8a7a;margin:16px 0 0">Serves Twenty · Thanksgiving and party planning</p>
</div>
